name: CICD workflow

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.25.6
          cache: true

      - name: Verify Go version
        run: go version

      - name: Download dependencies
        run: go mod tidy

      - name: Run linters
        run: |
          go install github.com/golangci-lint/golangci-lint@latest
          golangci-lint run --timeout 5m
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.25.6
          cache: true

      - name: Verify Go version
        run: go version

      - name: Download dependencies
        run: go mod tidy

      - name: Verify registry is running
        run: |
          curl http://localhost:5000/v2/_catalog || true
      - name: Run tests
        env:
          REGISTRY_URL: localhost:5000
          CI: "true"
        run: go test -v ./...

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.25.6
          cache: true

      - name: Verify Go version
        run: go version

      - name: Download dependencies
        run: go mod tidy

      - name: Build application
        run: |
          mkdir -p ./bin
          go build -o ./bin/runtime-manager ./cmd/runtime-manager/.
          go build -o ./bin/proxy ./cmd/proxy/.
      - name: Upload runtime-manager artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-manager-binary
          path: ./bin/runtime-manager

      - name: Upload proxy artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-binary
          path: ./bin/proxy

      - name: Upload faas-engine service artifact
        uses: actions/upload-artifact@v4
        with:
          name: faas-engine.service
          path: ./infra/faas-engine.service

      - name: Upload faas-proxy service artifact
        uses: actions/upload-artifact@v4
        with:
          name: faas-proxy.service
          path: ./infra/faas-proxy.service

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download runtime-manager artifact
        uses: actions/download-artifact@v4
        with:
          name: runtime-manager-binary
          path: ./artifacts

      - name: Download proxy artifact
        uses: actions/download-artifact@v4
        with:
          name: proxy-binary
          path: ./artifacts

      - name: Download faas-engine service artifact
        uses: actions/download-artifact@v4
        with:
          name: faas-engine.service
          path: ./artifacts

      - name: Download faas-proxy service artifact
        uses: actions/download-artifact@v4
        with:
          name: faas-proxy.service
          path: ./artifacts

      - name: Setting up WireGuard VPN
        uses: egor-tensin/setup-wireguard@v1
        with:
          endpoint: ${{ secrets.WG_SERVER_ENDPOINT }}
          endpoint_public_key: ${{ secrets.WG_SERVER_PUBLIC_KEY }}
          private_key: ${{ secrets.WG_PRIVATE_KEY }}
          ips: "${{ vars.VPN_CLIENT_IP }}/32"
          allowed_ips: "${{ vars.TARGET_PRIVATE_IP }}/32"

      - name: Verify wireguard connection
        run: |
          echo "==== WireGuard Status ===="
          sudo wg
          echo "==== Routing Table ===="
          ip route
          echo "==== Runner ip ===="
          ip addr show
      - name: Test SSH over VPN
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.TARGET_PRIVATE_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Connected to server"
            whoami
            hostname
      - name: Debug artifacts before SCP
        run: |
          echo "=== Workspace ==="  
          ls -la
          echo "=== Artifacts ==="
          ls -la artifacts
      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.TARGET_PRIVATE_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Create dedicated faas-engine user if it doesn't exist
            if ! id faas-engine &>/dev/null; then
              sudo useradd --system --no-create-home --shell /usr/sbin/nologin faas-engine
              echo "Created faas-engine user"
            else
              echo "faas-engine user already exists"
            fi

            # Create and configure deployment directory
            sudo mkdir -p /opt/faas-engine
            sudo chown -R faas-engine:faas-engine /opt/faas-engine
            sudo chmod 755 /opt/faas-engine
            echo "Deployment directory configured"
      - name: Clean old runtimes before copy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.TARGET_PRIVATE_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Cleaning old deployment files..."
            sudo rm -rf /opt/faas-engine/runtimes
            sudo rm -f /opt/faas-engine/runtime-manager
            echo "Ready for new deployment"

      - name: Copy all artifacts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.TARGET_PRIVATE_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./artifacts/*,./runtimes/"
          target: "/tmp"

      - name: Setup and build runtime images on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.TARGET_PRIVATE_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Moving runtimes to /opt..."
            sudo mkdir -p /opt/faas-engine
            sudo mv /tmp/runtimes /opt/faas-engine/runtimes
            sudo chown -R faas-engine:faas-engine /opt/faas-engine/runtimes
            sudo chmod -R 755 /opt/faas-engine/runtimes

            echo "Building runtime images..."
            cd /opt/faas-engine/runtimes
            docker build -t localhost:5000/runtimes/node:v1 node-runtime
            docker build -t localhost:5000/runtimes/python:v1 python-runtime
            docker push localhost:5000/runtimes/node:v1
            docker push localhost:5000/runtimes/python:v1
            echo "Runtime images built and pushed to local registry"

      - name: Deploy and restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.TARGET_PRIVATE_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euxo pipefail

            echo "=== Starting Deployment ==="

            # Ensure docker access
            sudo usermod -aG docker faas-engine

            echo "=== DEBUG: /tmp contents ==="
            ls -l /tmp

            echo "=== Validating artifacts ==="
            [ -f /tmp/artifacts/runtime-manager ] || { echo "Missing runtime-manager"; exit 1; }
            [ -f /tmp/artifacts/proxy ] || { echo "Missing proxy"; exit 1; }
            [ -f /tmp/artifacts/faas-engine.service ] || { echo "Missing faas-engine service file"; exit 1; }
            [ -f /tmp/artifacts/faas-proxy.service ] || { echo "Missing faas-proxy service file"; exit 1; }

            echo "=== Stopping existing services ==="
            sudo systemctl stop faas-engine || true
            sudo systemctl stop faas-proxy || true

            # Directories
            sudo mkdir -p /opt/faas-engine /backup/bin /backup/services

            TIMESTAMP=$(date +%Y%m%d-%H%M%S)

            echo "=== Backing up binaries ==="
            if [ -f /opt/faas-engine/runtime-manager ]; then
              sudo cp /opt/faas-engine/runtime-manager \
                /backup/bin/runtime-manager.$TIMESTAMP
            fi
            if [ -f /opt/faas-engine/proxy ]; then
              sudo cp /opt/faas-engine/proxy \
                /backup/bin/proxy.$TIMESTAMP
            fi

            echo "=== Backing up service files ==="
            if [ -f /etc/systemd/system/faas-engine.service ]; then
              sudo cp /etc/systemd/system/faas-engine.service \
                /backup/services/faas-engine.service.$TIMESTAMP
            fi
            if [ -f /etc/systemd/system/faas-proxy.service ]; then
              sudo cp /etc/systemd/system/faas-proxy.service \
                /backup/services/faas-proxy.service.$TIMESTAMP
            fi

            echo "=== Cleaning old binaries ==="
            sudo rm -f /opt/faas-engine/runtime-manager
            sudo rm -f /opt/faas-engine/proxy

            echo "=== Deploying runtime-manager binary ==="
            sudo mv /tmp/artifacts/runtime-manager /opt/faas-engine/runtime-manager
            sudo chmod +x /opt/faas-engine/runtime-manager
            sudo chown faas-engine:faas-engine /opt/faas-engine/runtime-manager

            echo "=== Deploying proxy binary ==="
            sudo mv /tmp/artifacts/proxy /opt/faas-engine/proxy
            sudo chmod +x /opt/faas-engine/proxy
            sudo chown faas-engine:faas-engine /opt/faas-engine/proxy

            echo "=== Setting directory permissions ==="
            sudo chmod 755 /opt/faas-engine

            echo "=== Deploying service files ==="
            sudo mv /tmp/artifacts/faas-engine.service /etc/systemd/system/faas-engine.service
            sudo mv /tmp/artifacts/faas-proxy.service /etc/systemd/system/faas-proxy.service

            echo "=== Reloading systemd ==="
            sudo systemctl daemon-reload
            sudo systemctl enable faas-engine
            sudo systemctl enable faas-proxy

            echo "=== Starting services ==="
            sudo systemctl restart faas-engine
            sudo systemctl restart faas-proxy

            echo "=== Checking services status ==="
            if ! sudo systemctl is-active --quiet faas-engine; then
              echo "faas-engine service failed to start"
              sudo journalctl -u faas-engine -n 50 --no-pager

              echo "=== Attempting rollback ==="
              LATEST_RUNTIME=$(ls -t /backup/bin/runtime-manager.* 2>/dev/null | head -n1)
              if [ -n "$LATEST_RUNTIME" ]; then
                sudo cp "$LATEST_RUNTIME" /opt/faas-engine/runtime-manager
                sudo chmod +x /opt/faas-engine/runtime-manager
                sudo chown faas-engine:faas-engine /opt/faas-engine/runtime-manager
                sudo systemctl restart faas-engine
                echo "Rollback attempted for runtime-manager"
              fi
              exit 1
            fi

            if ! sudo systemctl is-active --quiet faas-proxy; then
              echo "faas-proxy service failed to start"
              sudo journalctl -u faas-proxy -n 50 --no-pager

              echo "=== Attempting rollback ==="
              LATEST_PROXY=$(ls -t /backup/bin/proxy.* 2>/dev/null | head -n1)
              if [ -n "$LATEST_PROXY" ]; then
                sudo cp "$LATEST_PROXY" /opt/faas-engine/proxy
                sudo chmod +x /opt/faas-engine/proxy
                sudo chown faas-engine:faas-engine /opt/faas-engine/proxy
                sudo systemctl restart faas-proxy
                echo "Rollback attempted for proxy"
              fi
              exit 1
            fi

            echo "=== All services deployed successfully ==="
